<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* A court record: verdict first, then one tab per piece of work. */
:root {
  --paper: #faf9f5; --card: #ffffff; --ink: #23221e; --muted: #75726a; --rule: #e5e1d5;
  --mark: #fde047; --mark-ink: #383834; --ok: #2f7d4f; --old: #a3461c; --own: #2c5f8a; --chip: #f2efe5;
  --serif: "Source Serif 4", Georgia, serif; --sans: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1a1916; --card: #22211d; --ink: #ece9df; --muted: #a39f93; --rule: #393730;
  --mark: #fde047; --mark-ink: #2a2924; --ok: #74c597; --old: #ef9b73; --own: #8cbbe6; --chip: #2c2a24; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1a1916; --card: #22211d; --ink: #ece9df; --muted: #a39f93; --rule: #393730;
  --mark: #fde047; --mark-ink: #2a2924; --ok: #74c597; --old: #ef9b73; --own: #8cbbe6; --chip: #2c2a24; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans) }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font: 600 32px/1.15 var(--serif); margin: 4px 0 8px; text-wrap: balance }
h2 { font: 600 21px/1.25 var(--serif); margin: 26px 0 8px; text-wrap: balance }
h3 { font: 600 16px/1.3 var(--sans); margin: 18px 0 6px }
p { max-width: 70ch; margin: 0 0 10px }
.eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); padding-block: 8px; z-index: 5; border-bottom: 1px solid var(--rule) }
.tab { border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 500 13px var(--sans); cursor: pointer; white-space: nowrap }
.tab[aria-selected="true"] { background: var(--mark); color: var(--mark-ink); border-color: var(--mark) }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.tldr { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; margin-top: 12px }
.tldr ul { margin: 6px 0 0; padding-left: 20px } .tldr li { margin: 6px 0; max-width: 75ch }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0 }
.stat { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-width: 0 }
.stat b { display: block; font: 600 26px/1.1 var(--serif); font-variant-numeric: tabular-nums }
.stat span { font-size: 13px; color: var(--muted) }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 8px 18px; padding: 12px 0; border-bottom: 1px solid var(--rule) }
.id { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere }
.final { font: 17px/1.45 var(--serif); margin-top: 3px; overflow-wrap: anywhere }
.was { font: 14px/1.45 var(--serif); color: var(--muted); margin-top: 3px; overflow-wrap: anywhere }
.was s { text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start }
.chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap }
.chip.new { color: var(--ok) } .chip.old { color: var(--old) } .chip.own { color: var(--own) }
details.why { grid-column: 1 / -1; font-size: 13px; color: var(--muted) }
details.why summary { cursor: pointer }
details.why li { margin: 3px 0 }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 }
input[type=search], select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px }
input[type=search] { flex: 1 1 240px; min-width: 0 }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.more { margin: 14px 0; border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: 500 13px var(--sans); cursor: pointer }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin: 10px 0 }
.card h3 { margin-top: 0 }
code, pre { font: 12.5px/1.5 var(--mono) }
pre { background: var(--chip); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre }
table { border-collapse: collapse; width: 100%; font-size: 14px }
.tablewrap { overflow-x: auto }
th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--rule); vertical-align: top }
th { font: 600 12px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap }
@media (max-width: 640px) { .row { grid-template-columns: 1fr } h1 { font-size: 26px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p id="lede"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="view"></main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const fmt = (n) => Number(n).toLocaleString('en-GB');
document.getElementById('eyebrow').textContent = D.eyebrow || '';
document.getElementById('title').textContent = D.title;
document.getElementById('lede').textContent = D.lede || '';

const TABS = [['tldr', 'TL;DR'], ...D.sets.map(s => ['set-' + s.name, s.label])];
if (D.calls.length) TABS.push(['calls', 'The calls']);
for (const p of D.pages) TABS.push([p.key, p.label]);
let tab = 'tldr';
try { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) tab = h; } catch (e) {}

function renderTabs() {
  const box = document.getElementById('tabs'); box.replaceChildren();
  for (const [k, label] of TABS) {
    const b = el('button', 'tab', label); b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(k === tab));
    b.onclick = () => { tab = k; try { history.replaceState(null, '', '#' + k); } catch (e) {} render(); window.scrollTo(0, 0); };
    box.append(b);
  }
}
function html(container, markup) { const d = el('div'); d.innerHTML = markup; container.append(d); }

function verdictChip(r) {
  if (r.how === 'house rule only') return el('span', 'chip new', 'house rule');
  if (r.winnerBase === 1) return el('span', 'chip new', 'new wording kept');
  if (r.winnerBase === 0) return el('span', 'chip old', 'old wording kept');
  return el('span', 'chip own', 'panel wrote it');
}
const pickWord = (v) => v.base === 1 ? 'new' : v.base === 0 ? 'old' : 'own text';

function rowFor(r) {
  const row = el('div', 'row');
  const left = el('div');
  left.append(el('div', 'id', `${r.id}${r.field ? ' · ' + r.field : ''}`), el('div', 'final', r.final));
  if (r.final !== r.versions[0] && r.versions[0]) { const w = el('div', 'was'); w.append('Was: ', el('s', null, r.versions[0])); left.append(w); }
  if (r.final !== r.versions[1] && r.winnerBase !== 1) { const w = el('div', 'was'); w.append('Writers proposed: ', el('s', null, r.versions[1])); left.append(w); }
  const right = el('div', 'chips');
  right.append(verdictChip(r), el('span', 'chip', r.how));
  row.append(left, right);
  if (r.votes && r.votes.length) {
    const d = el('details', 'why'); d.append(el('summary', null, 'Why'));
    const ul = el('ul');
    for (const v of r.votes) ul.append(el('li', null, `${v.panel} picked ${pickWord(v)}: ${v.reason || ''}`));
    d.append(ul); row.append(d);
  }
  return row;
}

function listView(view, rows, id) {
  const groups = [...new Set(rows.map(r => r.group))].map(g => [g, D.groups[g] || g]);
  const tools = el('div', 'tools');
  const q = el('input'); q.type = 'search'; q.placeholder = 'Search wording or file'; q.id = id + '-q';
  q.setAttribute('aria-label', 'Search wording or file');
  const g = el('select'); g.id = id + '-g'; g.setAttribute('aria-label', 'Area');
  g.append(new Option('All areas', ''));
  for (const [k, label] of groups) g.append(new Option(label, k));
  const f = el('select'); f.id = id + '-f'; f.setAttribute('aria-label', 'Verdict');
  for (const [k, label] of [['', 'Every verdict'], ['changed', 'Judges overruled the writers'], ['old', 'Old wording kept'], ['own', 'Panel wrote its own'], ['split', 'Split decision']]) f.append(new Option(label, k));
  const count = el('span', 'count');
  tools.append(q, g, f, count);
  const list = el('div');
  const more = el('button', 'more', 'Show more'); more.type = 'button';
  view.append(tools, list, more);
  let limit = 120;
  const draw = () => {
    const term = q.value.trim().toLowerCase();
    const hits = rows.filter(r => (!g.value || r.group === g.value)
      && (!f.value || (f.value === 'changed' ? r.winnerBase !== 1 : f.value === 'old' ? r.winnerBase === 0 : f.value === 'own' ? r.winnerBase == null && r.how !== 'house rule only' : /^2 of/.test(r.how)))
      && (!term || (r.final + ' ' + r.versions.join(' ') + ' ' + r.id).toLowerCase().includes(term)));
    list.replaceChildren(...hits.slice(0, limit).map(rowFor));
    count.textContent = `${fmt(Math.min(limit, hits.length))} of ${fmt(hits.length)} shown`;
    more.hidden = hits.length <= limit;
  };
  q.oninput = () => { limit = 120; draw(); }; g.onchange = f.onchange = () => { limit = 120; draw(); };
  more.onclick = () => { limit += 200; draw(); };
  draw();
}

function render() {
  renderTabs();
  const view = document.getElementById('view'); view.replaceChildren();
  if (tab === 'tldr') {
    const box = el('section', 'tldr'); box.append(el('div', 'eyebrow', 'TL;DR'));
    const ul = el('ul'); for (const line of D.tldr) ul.append(el('li', null, line)); box.append(ul); view.append(box);
    const st = el('div', 'stats');
    for (const [n, label] of D.tiles) { const s = el('div', 'stat'); s.append(el('b', null, n), el('span', null, label)); st.append(s); }
    view.append(st);
  } else if (tab.startsWith('set-')) {
    const s = D.sets.find(x => 'set-' + x.name === tab);
    listView(view, D.rows.filter(r => r.set === s.name), s.name);
  } else if (tab === 'calls') {
    for (const c of D.calls) {
      const card = el('div', 'card'); card.append(el('h3', null, c.title), el('div', 'final', c.final));
      const chips = el('div', 'chips'); chips.append(el('span', 'chip new', c.how)); card.append(chips);
      const ul = el('ul'); for (const v of c.votes) ul.append(el('li', null, `${v.panel}: ${v.text.slice(0, 60)}${v.text.length > 60 ? '...' : ''} · ${v.reason}`));
      card.append(ul); view.append(card);
    }
  } else {
    const p = D.pages.find(x => x.key === tab); if (p) html(view, p.html);
  }
}
render();
</script>
